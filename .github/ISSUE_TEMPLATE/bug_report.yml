name: Bug report
description: Report a reproducible problem in Qwen-MM-Plugins
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Qwen-MM-Plugins. For security vulnerabilities, follow the [security policy](https://github.com/QwenLM/Qwen-MM-Plugins/security/policy) instead of opening a public issue.

  - type: dropdown
    id: capability
    attributes:
      label: Capability
      options:
        - core
        - video-memory
        - video-edit
        - blender
        - freecad
        - edu-agent
        - installer or packaging
        - other
    validations:
      required: true

  - type: input
    id: harness
    attributes:
      label: Agent harness
      description: For example, Claude Code, Codex, Qwen Code, Gemini CLI, or direct MCP.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release, commit SHA, or installation date
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, architecture, Python version, and relevant system tools.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest input and sequence that consistently triggers the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Include relevant logs or `--check-system` output. Remove API keys, credentials, private paths, and sensitive media.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
